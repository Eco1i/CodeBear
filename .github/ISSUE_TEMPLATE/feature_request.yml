name: 功能建议
description: 提议新的使用场景或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述使用场景和当前阻碍，不要包含真实业务数据。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案

