name: 缺陷报告
description: 报告可以稳定复现的码熊问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿上传真实 PDM、data、备份包、API Key 或其他敏感数据。
  - type: input
    id: version
    attributes:
      label: 码熊版本
      placeholder: 例如 1.0.0
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: 运行方式
      options: [Windows 绿色版, 从源码运行]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

